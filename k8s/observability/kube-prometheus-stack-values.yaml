crds:
  enabled: true

defaultRules:
  create: false

alertmanager:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  nodeSelector:
    kubernetes.io/arch: arm64
    kubernetes.io/os: linux
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  enabled: true
  prometheusSpec:
    retention: 2d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    nodeSelector:
      kubernetes.io/arch: arm64
      kubernetes.io/os: linux
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      emptyDir:
        sizeLimit: 4Gi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  nodeSelector:
    kubernetes.io/arch: arm64
    kubernetes.io/os: linux
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

nodeExporter:
  enabled: true

prometheus-node-exporter:
  nodeSelector:
    kubernetes.io/arch: arm64
    kubernetes.io/os: linux
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  extraVolumes:
    - name: grafana-data
      emptyDir:
        sizeLimit: 1Gi
  extraVolumeMounts:
    - name: grafana-data
      mountPath: /var/lib/grafana-data
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  nodeSelector:
    kubernetes.io/arch: arm64
    kubernetes.io/os: linux
  grafana.ini:
    paths:
      data: /var/lib/grafana-data
      plugins: /var/lib/grafana-data/plugins
    unified_storage:
      index_path: /var/lib/grafana-data/bleve
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      editable: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: observability
      sizeLimit: 64Mi
    datasources:
      sizeLimit: 16Mi
