name: Reusable CI & DevSecOps Pipeline

on:
  workflow_call:
    inputs:
      service_name:
        description: "Nome do microsserviço"
        required: true
        type: string
      service_path:
        description: "Caminho relativo do microsserviço no repositório"
        required: true
        type: string
      language:
        description: "Linguagem principal do serviço (go ou python)"
        required: true
        type: string

jobs:
  # =========================================================================
  # ESTÁGIO 1: Build & Unit Test
  # =========================================================================
  build-and-test:
    name: "1. Build & Test (${{ inputs.service_name }})"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.service_path }}/go.mod

      - name: Build e Testes Unitários (Go)
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_path }}
        run: |
          go build -v ./...
          go test -v ./...

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências e Rodar Testes (Python)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m py_compile app.py
          pytest || [ $? -eq 5 ]

  # =========================================================================
  # ESTÁGIO 2: Linter / Static Analysis
  # =========================================================================
  lint:
    name: "2. Linter (${{ inputs.service_name }})"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.service_path }}/go.mod

      - name: Linter Go (golangci-lint)
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ inputs.service_path }}
          version: latest

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linter Python (flake8)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          python -m pip install --upgrade pip flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # =========================================================================
  # ESTÁGIO 3: Security Scan (SAST & SCA com Regra de Bloqueio CRITICAL)
  # =========================================================================
  security-sast-sca:
    name: "3. SAST & SCA (${{ inputs.service_name }})"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.service_path }}/go.mod

      - name: SAST Go (gosec)
        if: inputs.language == 'go'
        uses: securego/gosec@master
        with:
          args: "-severity high -confidence medium ./..."
        env:
          GO111MODULE: "on"

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: SAST Python (bandit)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          python -m pip install --upgrade pip bandit
          bandit -r . -lll

      - name: SCA & Secret Scan (Trivy FS — Bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: ${{ inputs.service_path }}
          scanners: "vuln,secret"
          severity: "CRITICAL"
          exit-code: "1"

  # =========================================================================
  # ESTÁGIO 4: Docker Build (ARM64) & Container Security Scan
  # =========================================================================
  docker-build-and-scan:
    name: "4. Docker Build & Scan (${{ inputs.service_name }})"
    needs: [build-and-test, lint, security-sast-sca]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar QEMU (emulação ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service_path }}
          file: ${{ inputs.service_path }}/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: solidarytech/${{ inputs.service_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Scan (Trivy Image — Bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: solidarytech/${{ inputs.service_name }}:${{ github.sha }}
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"