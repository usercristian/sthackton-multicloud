name: Bootstrap GitOps no OKE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-gitops:
    name: Bootstrap ArgoCD e Traefik no OKE
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: oci-gitops-bootstrap
      cancel-in-progress: false
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_CLI_REGION: sa-saopaulo-1
      SUPPRESS_LABEL_WARNING: "True"
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Python para OCI CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar OCI CLI
        run: python -m pip install --disable-pip-version-check oci-cli

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4

      - name: Configurar OCI CLI e credenciais locais
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          : "${OCI_CLI_TENANCY:?Secret OCI_TENANCY_OCID não configurado}"
          : "${OCI_CLI_USER:?Secret OCI_USER_OCID não configurado}"
          : "${OCI_CLI_FINGERPRINT:?Secret OCI_FINGERPRINT não configurado}"
          : "${OCI_CLI_KEY_CONTENT:?Secret OCI_PRIVATE_KEY não configurado}"
          : "${OCI_CLI_COMPARTMENT:?Secret OCI_COMPARTMENT_OCID não configurado}"

          mkdir -m 700 -p "${HOME}/.oci"
          umask 077
          OCI_KEY_FILE="${HOME}/.oci/oci_api_key.pem"
          printf '%s\n' "${OCI_CLI_KEY_CONTENT}" > "${OCI_KEY_FILE}"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "${OCI_CLI_USER}" \
            "${OCI_CLI_FINGERPRINT}" \
            "${OCI_CLI_TENANCY}" \
            "${OCI_CLI_REGION}" \
            "${OCI_KEY_FILE}" > "${HOME}/.oci/config"

          {
            echo "OCI_TENANCY_OCID=${OCI_CLI_TENANCY}"
            echo "OCI_USER_OCID=${OCI_CLI_USER}"
            echo "OCI_FINGERPRINT=${OCI_CLI_FINGERPRINT}"
            echo "OCI_REGION=${OCI_CLI_REGION}"
            echo "OCI_PRIVATE_KEY_PATH=${OCI_KEY_FILE}"
            echo "TF_VAR_private_key_path=${OCI_KEY_FILE}"
          } >> "${GITHUB_ENV}"
          unset OCI_CLI_KEY_CONTENT

      - name: Inicializar Terraform e extrair outputs oficiais
        id: terraform-outputs
        working-directory: infra/environments/oci-prod
        run: |
          set -euo pipefail

          TENANCY_NAMESPACE=$(oci --auth api_key --region "${OCI_CLI_REGION}" os ns get \
            --query 'data' \
            --raw-output)
          terraform init -input=false \
            -backend-config="namespace=${TENANCY_NAMESPACE}" \
            -backend-config="bucket=solidarytech-tfstate-prod" \
            -backend-config="key=oci-prod/terraform.tfstate" \
            -backend-config="region=${OCI_CLI_REGION}"

          if ! OUTPUTS=$(terraform output -json); then
            echo "ERRO: Não foi possível ler outputs do Terraform State. Execute infra-oci-lifecycle.yml com action=apply primeiro." >&2
            exit 1
          fi
          OKE_CLUSTER_ID=$(jq -r '.oke_cluster_id.value // empty' <<<"${OUTPUTS}")
          POSTGRES_PRIVATE_IP=$(jq -r '.postgres_private_ip.value // empty' <<<"${OUTPUTS}")
          POSTGRES_ADMIN_USERNAME=$(jq -r '.postgres_admin_username.value // empty' <<<"${OUTPUTS}")

          if [[ -z "${OKE_CLUSTER_ID}" ]]; then
            echo "ERRO: OKE não provisionado no Terraform State. Execute infra-oci-lifecycle.yml com action=apply primeiro." >&2
            exit 1
          fi
          if [[ -z "${POSTGRES_PRIVATE_IP}" || -z "${POSTGRES_ADMIN_USERNAME}" ]]; then
            echo "ERRO: Outputs do PostgreSQL ausentes no Terraform State; verifique a infraestrutura antes do bootstrap." >&2
            exit 1
          fi
          if [[ ! "${OKE_CLUSTER_ID}" =~ ^ocid1\.cluster\.[A-Za-z0-9._-]+$ ]]; then
            echo "ERRO: O output oke_cluster_id não tem o formato esperado." >&2
            exit 1
          fi
          if ! python3 -c 'import ipaddress, sys; ipaddress.ip_address(sys.argv[1])' \
            "${POSTGRES_PRIVATE_IP}" >/dev/null 2>&1; then
            echo "ERRO: O output postgres_private_ip não é um endereço IP válido." >&2
            exit 1
          fi
          if [[ ! "${POSTGRES_ADMIN_USERNAME}" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "ERRO: O output postgres_admin_username contém caracteres inválidos." >&2
            exit 1
          fi

          {
            echo "OKE_CLUSTER_ID=${OKE_CLUSTER_ID}"
            echo "POSTGRES_PRIVATE_IP=${POSTGRES_PRIVATE_IP}"
            echo "POSTGRES_ADMIN_USERNAME=${POSTGRES_ADMIN_USERNAME}"
          } >> "${GITHUB_ENV}"
          echo "Outputs oficiais do OKE e PostgreSQL carregados do Terraform State."

      - name: Liberar temporariamente IP do Runner na Security List (TCP/6443)
        run: |
          set -euo pipefail
          set +x
          umask 077

          is_ipv4() {
            python3 -c 'import ipaddress, sys; ipaddress.IPv4Address(sys.argv[1])' \
              "$1" >/dev/null 2>&1
          }

          RUNNER_IP=$(curl -fsSL --max-time 10 https://checkip.amazonaws.com \
            | tr -d '[:space:]') || RUNNER_IP=""
          if ! is_ipv4 "${RUNNER_IP}"; then
            RUNNER_IP=$(curl -fsSL --max-time 10 https://ifconfig.me/ip \
              | tr -d '[:space:]') || RUNNER_IP=""
          fi
          if ! is_ipv4 "${RUNNER_IP}"; then
            echo "ERRO: Não foi possível obter um IPv4 público válido para o runner." >&2
            exit 1
          fi
          RUNNER_CIDR="${RUNNER_IP}/32"

          SECURITY_LISTS=$(oci network security-list list \
            --compartment-id "${OCI_CLI_COMPARTMENT}" \
            --display-name "solidarytech-sl-public-lb" \
            --lifecycle-state AVAILABLE \
            --all \
            --query 'data')
          MATCHING_SECURITY_LISTS=$(jq -c \
            '[.[] | select(."display-name" == "solidarytech-sl-public-lb" and ."lifecycle-state" == "AVAILABLE")]' \
            <<<"${SECURITY_LISTS}")
          SECURITY_LIST_COUNT=$(jq 'length' <<<"${MATCHING_SECURITY_LISTS}")
          if [[ "${SECURITY_LIST_COUNT}" -ne 1 ]]; then
            echo "ERRO: Esperada exatamente uma Security List AVAILABLE 'solidarytech-sl-public-lb'; encontradas: ${SECURITY_LIST_COUNT}." >&2
            exit 1
          fi
          SECURITY_LIST_ID=$(jq -r '.[0].id' <<<"${MATCHING_SECURITY_LISTS}")

          RULES_HELPER="${RUNNER_TEMP}/solidarytech-security-list-rules.py"
          cat > "${RULES_HELPER}" <<'PY'
          # OCI CLI returns kebab-case fields; update requests use camelCase.
          import json
          import sys
          from pathlib import Path

          def is_runner_rule(rule, runner_cidr):
              tcp_options = rule.get("tcp-options") or {}
              destination = tcp_options.get("destination-port-range") or {}
              return (
                  rule.get("source") == runner_cidr
                  and str(rule.get("protocol")) == "6"
                  and rule.get("source-type", "CIDR_BLOCK") == "CIDR_BLOCK"
                  and not rule.get("is-stateless", False)
                  and destination.get("min") == 6443
                  and destination.get("max") == 6443
              )

          def is_temporary_rule(rule):
              tcp_options = rule.get("tcp-options") or {}
              destination = tcp_options.get("destination-port-range") or {}
              description = rule.get("description") or ""
              return (
                  description.startswith("temp-gh-runner-")
                  and str(rule.get("protocol")) == "6"
                  and destination.get("min") == 6443
                  and destination.get("max") == 6443
              )

          def convert_port_options(options):
              if not isinstance(options, dict):
                  return None
              converted = {}
              for old_name, new_name in (
                  ("destination-port-range", "destinationPortRange"),
                  ("source-port-range", "sourcePortRange"),
              ):
                  port_range = options.get(old_name)
                  if isinstance(port_range, dict):
                      converted[new_name] = {
                          key: port_range[key]
                          for key in ("min", "max")
                          if port_range.get(key) is not None
                      }
              return converted or None

          def convert_rule(rule):
              converted = {
                  "isStateless": rule.get("is-stateless", False),
                  "protocol": rule["protocol"],
              }
              for old_name, new_name in (
                  ("description", "description"),
                  ("source", "source"),
                  ("source-type", "sourceType"),
              ):
                  if rule.get(old_name) is not None:
                      converted[new_name] = rule[old_name]
              icmp_options = rule.get("icmp-options")
              if isinstance(icmp_options, dict):
                  converted["icmpOptions"] = {
                      key: icmp_options[key]
                      for key in ("type", "code")
                      if icmp_options.get(key) is not None
                  }
              for old_name, new_name in (
                  ("tcp-options", "tcpOptions"),
                  ("udp-options", "udpOptions"),
              ):
                  options = convert_port_options(rule.get(old_name))
                  if options:
                      converted[new_name] = options
              return converted

          mode, source_file, update_file, runner_cidr, runner_description, *extra = sys.argv[1:]
          rules = json.loads(Path(source_file).read_text())
          if rules is None:
              rules = []
          if not isinstance(rules, list):
              raise SystemExit("Ingress rules OCI CLI não retornou uma lista.")

          if mode == "add":
              orphan_rules = [rule for rule in rules if is_temporary_rule(rule)]
              rules = [rule for rule in rules if not is_temporary_rule(rule)]
              rule_exists = any(is_runner_rule(rule, runner_cidr) for rule in rules)
              update_rules = [convert_rule(rule) for rule in rules]
              if not rule_exists:
                  update_rules.append({
                      "description": runner_description,
                      "isStateless": False,
                      "protocol": "6",
                      "source": runner_cidr,
                      "sourceType": "CIDR_BLOCK",
                      "tcpOptions": {
                          "destinationPortRange": {"min": 6443, "max": 6443}
                      },
                  })
              Path(update_file).write_text(json.dumps(update_rules))
              print(json.dumps({
                  "rule_added": not rule_exists,
                  "orphan_rules_removed": len(orphan_rules),
              }))
          elif mode == "remove":
              rule_added = extra[0] == "true"
              def should_remove(rule):
                  description = rule.get("description") or ""
                  return is_temporary_rule(rule) or (
                      rule_added
                      and is_runner_rule(rule, runner_cidr)
                      and (
                          description == runner_description
                          or description.startswith("temp-gh-runner-")
                      )
                  )

              matching_rules = [rule for rule in rules if should_remove(rule)]
              rules = [rule for rule in rules if not should_remove(rule)]
              Path(update_file).write_text(
                  json.dumps([convert_rule(rule) for rule in rules])
              )
              print(len(matching_rules))
          else:
              raise SystemExit(f"Modo de operação inválido: {mode}")
          PY
          chmod 600 "${RULES_HELPER}"

          CURRENT_RULES=$(oci network security-list get \
            --security-list-id "${SECURITY_LIST_ID}" \
            --query 'data."ingress-security-rules"')
          RULES_SOURCE_FILE="${RUNNER_TEMP}/solidarytech-ingress-rules-source.json"
          RULES_UPDATE_FILE="${RUNNER_TEMP}/solidarytech-ingress-rules-update.json"
          printf '%s\n' "${CURRENT_RULES}" > "${RULES_SOURCE_FILE}"

          RUNNER_RULE_DESCRIPTION="temp-gh-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUNNER_RULE_RESULT=$(python3 "${RULES_HELPER}" add \
            "${RULES_SOURCE_FILE}" \
            "${RULES_UPDATE_FILE}" \
            "${RUNNER_CIDR}" \
            "${RUNNER_RULE_DESCRIPTION}")
          RUNNER_RULE_ADDED=$(jq -r '.rule_added' <<<"${RUNNER_RULE_RESULT}")
          ORPHAN_RULES_REMOVED=$(jq -r '.orphan_rules_removed' <<<"${RUNNER_RULE_RESULT}")

          {
            echo "SECURITY_LIST_ID=${SECURITY_LIST_ID}"
            echo "RUNNER_CIDR=${RUNNER_CIDR}"
            echo "RUNNER_RULE_DESCRIPTION=${RUNNER_RULE_DESCRIPTION}"
            echo "RUNNER_RULE_ADDED=${RUNNER_RULE_ADDED}"
          } >> "${GITHUB_ENV}"

          if [[ "${RUNNER_RULE_ADDED}" == "true" || "${ORPHAN_RULES_REMOVED}" -gt 0 ]]; then
            oci network security-list update \
              --security-list-id "${SECURITY_LIST_ID}" \
              --ingress-security-rules "file://${RULES_UPDATE_FILE}" \
              --force \
              --wait-for-state AVAILABLE \
              --max-wait-seconds 180 \
              >/dev/null
            echo "Regras temporárias anteriores removidas; acesso desta execução configurado."
          else
            echo "A regra equivalente já existia; nenhuma alteração foi necessária."
          fi

      - name: Executar bootstrap GitOps
        id: bootstrap
        run: |
          chmod +x infra/scripts/oci-oke-gitops-bootstrap.sh
          ./infra/scripts/oci-oke-gitops-bootstrap.sh

      - name: Gerar sumário do bootstrap
        if: always()
        env:
          BOOTSTRAP_STATUS: ${{ steps.bootstrap.outcome }}
          TERRAFORM_STATUS: ${{ steps.terraform-outputs.outcome }}
        run: |
          set -u

          CLUSTER_STATUS="Não consultado"
          if [[ -n "${OKE_CLUSTER_ID:-}" ]]; then
            if CLUSTER_JSON=$(oci --auth api_key --region "${OCI_CLI_REGION}" ce cluster get \
              --cluster-id "${OKE_CLUSTER_ID}" \
              --query 'data'); then
              CLUSTER_STATUS=$(jq -r '."lifecycle-state" // "Unknown"' <<<"${CLUSTER_JSON}")
            else
              CLUSTER_STATUS="Indisponível (consulta OCI falhou)"
            fi
          fi

          TRAEFIK_ENDPOINTS="Indisponível"
          ARGOCD_APPLICATION="Indisponível"
          if [[ -f "${HOME}/.kube/config" ]]; then
            if TRAEFIK_SERVICE=$(kubectl -n traefik get service traefik -o json); then
              TRAEFIK_ENDPOINTS=$(jq -r \
                '[.status.loadBalancer.ingress[]? | (.ip // .hostname // empty)] | join(", ")' \
                <<<"${TRAEFIK_SERVICE}")
              if [[ -z "${TRAEFIK_ENDPOINTS}" ]]; then
                TRAEFIK_ENDPOINTS="Aguardando endereço do Load Balancer"
              fi
            fi

            if APPLICATION=$(kubectl -n argocd get application.argoproj.io solidarytech-oci-prod -o json); then
              SYNC_STATUS=$(jq -r '.status.sync.status // "Unknown"' <<<"${APPLICATION}")
              HEALTH_STATUS=$(jq -r '.status.health.status // "Unknown"' <<<"${APPLICATION}")
              ARGOCD_APPLICATION="sync=${SYNC_STATUS}; health=${HEALTH_STATUS}"
            fi
          fi

          {
            echo "## Bootstrap GitOps OKE"
            echo ""
            echo "| Item | Status |"
            echo "|---|---|"
            echo "| Outputs do Terraform | \`${TERRAFORM_STATUS:-não executado}\` |"
            echo "| Bootstrap | \`${BOOTSTRAP_STATUS:-não executado}\` |"
            echo "| Cluster OKE | \`${CLUSTER_STATUS}\` |"
            echo "| Load Balancer Traefik | \`${TRAEFIK_ENDPOINTS}\` |"
            echo "| Application ArgoCD | \`${ARGOCD_APPLICATION}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Revogar acesso temporario do Runner na Security List (TCP/6443)
        if: always()
        run: |
          set -euo pipefail
          set +x

          cleanup_local_credentials() {
            rm -f \
              "${HOME}/.oci/config" \
              "${HOME}/.oci/oci_api_key.pem" \
              "${HOME}/.kube/config" \
              "${RUNNER_TEMP}/solidarytech-security-list-rules.py" \
              "${RUNNER_TEMP}/solidarytech-ingress-rules-source.json" \
              "${RUNNER_TEMP}/solidarytech-ingress-rules-current.json" \
              "${RUNNER_TEMP}/solidarytech-ingress-rules-update.json"
          }
          trap cleanup_local_credentials EXIT

          SECURITY_LIST_ID="${SECURITY_LIST_ID:-}"
          RUNNER_CIDR="${RUNNER_CIDR:-}"
          RUNNER_RULE_DESCRIPTION="${RUNNER_RULE_DESCRIPTION:-}"
          if [[ -z "${SECURITY_LIST_ID}" || -z "${RUNNER_CIDR}" || -z "${RUNNER_RULE_DESCRIPTION}" ]]; then
            echo "Nenhuma regra temporária foi preparada para revogação."
            exit 0
          fi

          CURRENT_RULES_FILE="${RUNNER_TEMP}/solidarytech-ingress-rules-current.json"
          RULES_UPDATE_FILE="${RUNNER_TEMP}/solidarytech-ingress-rules-update.json"
          REVOKED=0
          for attempt in 1 2 3; do
            if ! CURRENT_RULES=$(oci network security-list get \
              --security-list-id "${SECURITY_LIST_ID}" \
              --query 'data."ingress-security-rules"'); then
              echo "Falha ao ler regras para revogação (tentativa ${attempt}/3)." >&2
              sleep $((attempt * 5))
              continue
            fi
            printf '%s\n' "${CURRENT_RULES}" > "${CURRENT_RULES_FILE}"

            REMOVED_COUNT=$(python3 \
              "${RUNNER_TEMP}/solidarytech-security-list-rules.py" \
              remove \
              "${CURRENT_RULES_FILE}" \
              "${RULES_UPDATE_FILE}" \
              "${RUNNER_CIDR}" \
              "${RUNNER_RULE_DESCRIPTION}" \
              "${RUNNER_RULE_ADDED:-false}")

            if [[ "${REMOVED_COUNT}" -eq 0 ]]; then
              echo "A regra temporária já está ausente ou não foi criada; estado preservado."
              REVOKED=1
              break
            fi

            if oci network security-list update \
              --security-list-id "${SECURITY_LIST_ID}" \
              --ingress-security-rules "file://${RULES_UPDATE_FILE}" \
              --force \
              --wait-for-state AVAILABLE \
              --max-wait-seconds 180 \
              >/dev/null; then
              echo "A regra temporária do runner foi revogada."
              REVOKED=1
              break
            fi
            echo "Falha ao atualizar a Security List para revogar o acesso (tentativa ${attempt}/3)." >&2
            sleep $((attempt * 5))
          done

          if [[ "${REVOKED}" -ne 1 ]]; then
            echo "ERRO: Não foi possível confirmar a revogação do acesso temporário após três tentativas." >&2
            exit 1
          fi
