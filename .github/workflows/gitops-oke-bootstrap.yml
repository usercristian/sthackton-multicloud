name: Bootstrap GitOps no OKE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-gitops:
    name: Bootstrap ArgoCD e Traefik no OKE
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: oci-gitops-bootstrap
      cancel-in-progress: false
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_CLI_REGION: sa-saopaulo-1
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Python para OCI CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar OCI CLI
        run: python -m pip install --disable-pip-version-check oci-cli

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4

      - name: Configurar OCI CLI e credenciais locais
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          : "${OCI_CLI_TENANCY:?Secret OCI_TENANCY_OCID não configurado}"
          : "${OCI_CLI_USER:?Secret OCI_USER_OCID não configurado}"
          : "${OCI_CLI_FINGERPRINT:?Secret OCI_FINGERPRINT não configurado}"
          : "${OCI_CLI_KEY_CONTENT:?Secret OCI_PRIVATE_KEY não configurado}"
          : "${OCI_CLI_COMPARTMENT:?Secret OCI_COMPARTMENT_OCID não configurado}"

          mkdir -m 700 -p "${HOME}/.oci"
          umask 077
          OCI_KEY_FILE="${HOME}/.oci/oci_api_key.pem"
          printf '%s\n' "${OCI_CLI_KEY_CONTENT}" > "${OCI_KEY_FILE}"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "${OCI_CLI_USER}" \
            "${OCI_CLI_FINGERPRINT}" \
            "${OCI_CLI_TENANCY}" \
            "${OCI_CLI_REGION}" \
            "${OCI_KEY_FILE}" > "${HOME}/.oci/config"

          {
            echo "OCI_TENANCY_OCID=${OCI_CLI_TENANCY}"
            echo "OCI_USER_OCID=${OCI_CLI_USER}"
            echo "OCI_FINGERPRINT=${OCI_CLI_FINGERPRINT}"
            echo "OCI_REGION=${OCI_CLI_REGION}"
            echo "OCI_PRIVATE_KEY_PATH=${OCI_KEY_FILE}"
            echo "TF_VAR_private_key_path=${OCI_KEY_FILE}"
          } >> "${GITHUB_ENV}"
          unset OCI_CLI_KEY_CONTENT

      - name: Inicializar Terraform e extrair outputs oficiais
        id: terraform-outputs
        working-directory: infra/environments/oci-prod
        run: |
          set -euo pipefail

          TENANCY_NAMESPACE=$(oci --auth api_key --region "${OCI_CLI_REGION}" os ns get \
            --query 'data' \
            --raw-output)
          terraform init -input=false \
            -backend-config="namespace=${TENANCY_NAMESPACE}" \
            -backend-config="bucket=solidarytech-tfstate-prod" \
            -backend-config="key=oci-prod/terraform.tfstate" \
            -backend-config="region=${OCI_CLI_REGION}"

          if ! OUTPUTS=$(terraform output -json); then
            echo "ERRO: Não foi possível ler outputs do Terraform State. Execute infra-oci-lifecycle.yml com action=apply primeiro." >&2
            exit 1
          fi
          OKE_CLUSTER_ID=$(jq -r '.oke_cluster_id.value // empty' <<<"${OUTPUTS}")
          POSTGRES_PRIVATE_IP=$(jq -r '.postgres_private_ip.value // empty' <<<"${OUTPUTS}")
          POSTGRES_ADMIN_USERNAME=$(jq -r '.postgres_admin_username.value // empty' <<<"${OUTPUTS}")

          if [[ -z "${OKE_CLUSTER_ID}" ]]; then
            echo "ERRO: OKE não provisionado no Terraform State. Execute infra-oci-lifecycle.yml com action=apply primeiro." >&2
            exit 1
          fi
          if [[ -z "${POSTGRES_PRIVATE_IP}" || -z "${POSTGRES_ADMIN_USERNAME}" ]]; then
            echo "ERRO: Outputs do PostgreSQL ausentes no Terraform State; verifique a infraestrutura antes do bootstrap." >&2
            exit 1
          fi
          if [[ ! "${OKE_CLUSTER_ID}" =~ ^ocid1\.cluster\.[A-Za-z0-9._-]+$ ]]; then
            echo "ERRO: O output oke_cluster_id não tem o formato esperado." >&2
            exit 1
          fi
          if ! python3 -c 'import ipaddress, sys; ipaddress.ip_address(sys.argv[1])' \
            "${POSTGRES_PRIVATE_IP}" >/dev/null 2>&1; then
            echo "ERRO: O output postgres_private_ip não é um endereço IP válido." >&2
            exit 1
          fi
          if [[ ! "${POSTGRES_ADMIN_USERNAME}" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "ERRO: O output postgres_admin_username contém caracteres inválidos." >&2
            exit 1
          fi

          {
            echo "OKE_CLUSTER_ID=${OKE_CLUSTER_ID}"
            echo "POSTGRES_PRIVATE_IP=${POSTGRES_PRIVATE_IP}"
            echo "POSTGRES_ADMIN_USERNAME=${POSTGRES_ADMIN_USERNAME}"
          } >> "${GITHUB_ENV}"
          echo "Outputs oficiais do OKE e PostgreSQL carregados do Terraform State."

      - name: Executar bootstrap GitOps
        id: bootstrap
        run: |
          chmod +x infra/scripts/oci-oke-gitops-bootstrap.sh
          ./infra/scripts/oci-oke-gitops-bootstrap.sh

      - name: Gerar sumário do bootstrap
        if: always()
        env:
          BOOTSTRAP_STATUS: ${{ steps.bootstrap.outcome }}
          TERRAFORM_STATUS: ${{ steps.terraform-outputs.outcome }}
        run: |
          set -u

          CLUSTER_STATUS="Não consultado"
          if [[ -n "${OKE_CLUSTER_ID:-}" ]]; then
            if CLUSTER_JSON=$(oci --auth api_key --region "${OCI_CLI_REGION}" ce cluster get \
              --cluster-id "${OKE_CLUSTER_ID}" \
              --query 'data'); then
              CLUSTER_STATUS=$(jq -r '."lifecycle-state" // "Unknown"' <<<"${CLUSTER_JSON}")
            else
              CLUSTER_STATUS="Indisponível (consulta OCI falhou)"
            fi
          fi

          TRAEFIK_ENDPOINTS="Indisponível"
          ARGOCD_APPLICATION="Indisponível"
          if [[ -f "${HOME}/.kube/config" ]]; then
            if TRAEFIK_SERVICE=$(kubectl -n traefik get service traefik -o json); then
              TRAEFIK_ENDPOINTS=$(jq -r \
                '[.status.loadBalancer.ingress[]? | (.ip // .hostname // empty)] | join(", ")' \
                <<<"${TRAEFIK_SERVICE}")
              if [[ -z "${TRAEFIK_ENDPOINTS}" ]]; then
                TRAEFIK_ENDPOINTS="Aguardando endereço do Load Balancer"
              fi
            fi

            if APPLICATION=$(kubectl -n argocd get application.argoproj.io solidarytech-oci-prod -o json); then
              SYNC_STATUS=$(jq -r '.status.sync.status // "Unknown"' <<<"${APPLICATION}")
              HEALTH_STATUS=$(jq -r '.status.health.status // "Unknown"' <<<"${APPLICATION}")
              ARGOCD_APPLICATION="sync=${SYNC_STATUS}; health=${HEALTH_STATUS}"
            fi
          fi

          {
            echo "## Bootstrap GitOps OKE"
            echo ""
            echo "| Item | Status |"
            echo "|---|---|"
            echo "| Outputs do Terraform | \`${TERRAFORM_STATUS:-não executado}\` |"
            echo "| Bootstrap | \`${BOOTSTRAP_STATUS:-não executado}\` |"
            echo "| Cluster OKE | \`${CLUSTER_STATUS}\` |"
            echo "| Load Balancer Traefik | \`${TRAEFIK_ENDPOINTS}\` |"
            echo "| Application ArgoCD | \`${ARGOCD_APPLICATION}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remover credenciais temporárias
        if: always()
        run: rm -f "${HOME}/.oci/config" "${HOME}/.oci/oci_api_key.pem" "${HOME}/.kube/config"
