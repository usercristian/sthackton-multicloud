name: Infraestrutura OCI

on:
  pull_request:
    branches: ["master"]
    paths:
      - "infra/**"
      - ".github/workflows/infra-oci-lifecycle.yml"
      - ".github/workflows/_reusable-terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Operação de Infraestrutura"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

concurrency:
  group: oci-infra-lifecycle
  cancel-in-progress: false

jobs:
  oci-prod:
    uses: ./.github/workflows/_reusable-terraform.yml
    with:
      action: ${{ github.event_name == 'pull_request' && 'plan' || inputs.action }}
      working_directory: "infra/environments/oci-prod"
      oci_region: "sa-saopaulo-1"
      state_bucket: "solidarytech-tfstate-prod"
      state_key: "oci-prod/terraform.tfstate"
    secrets: inherit