name: Reusable OCI Terraform Lifecycle

on:
  workflow_call:
    inputs:
      action:
        description: "Ação a executar (plan, apply ou destroy)"
        required: true
        type: string
      working_directory:
        description: "Diretório do ambiente Terraform"
        required: true
        type: string
      oci_region:
        description: "Região OCI"
        required: false
        type: string
        default: "sa-saopaulo-1"
      state_bucket:
        description: "Nome do bucket de estado remoto"
        required: false
        type: string
        default: "solidarytech-tfstate-prod"
      state_key:
        description: "Caminho do arquivo .tfstate dentro do bucket"
        required: false
        type: string
        default: "oci-prod/terraform.tfstate"
    secrets:
      OCI_TENANCY_OCID:
        required: true
      OCI_USER_OCID:
        required: true
      OCI_FINGERPRINT:
        required: true
      OCI_PRIVATE_KEY:
        required: true
      OCI_COMPARTMENT_OCID:
        required: true

jobs:
  terraform-lifecycle:
    name: "OCI Infra (${{ inputs.action }})"
    runs-on: ubuntu-latest
    env:
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_CLI_REGION: ${{ inputs.oci_region }}
      TF_STATE_BUCKET: ${{ inputs.state_bucket }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_region: ${{ inputs.oci_region }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar OCI CLI
        id: cli
        run: |
          python3 -m pip install --upgrade pip
          pip install oci-cli

      - name: Preflight & Bootstrap do Backend (OCI Object Storage)
        id: preflight
        if: github.event_name != 'pull_request'
        run: |
          chmod +x infra/scripts/oci-state-preflight.sh
          ./infra/scripts/oci-state-preflight.sh

      - name: Preflight & Bootstrap de Secrets (OCI Vault)
        id: secrets_preflight
        if: github.event_name != 'pull_request'
        run: |
          chmod +x infra/scripts/oci-secrets-preflight.sh
          ./infra/scripts/oci-secrets-preflight.sh

      - name: Validar backend existente sem alterações (PR)
        id: preflight_pr
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          NAMESPACE=$(oci --auth api_key --region "${OCI_CLI_REGION}" os ns get \
            --query 'data' \
            --raw-output)
          if ! BUCKET=$(oci --auth api_key --region "${OCI_CLI_REGION}" os bucket get \
            --namespace-name "${NAMESPACE}" \
            --bucket-name "${TF_STATE_BUCKET}" \
            --query 'data'); then
            echo "ERRO: Backend '${TF_STATE_BUCKET}' não existe. Execute o workflow de infraestrutura manualmente antes do PR." >&2
            exit 1
          fi

          BUCKET_COMPARTMENT=$(jq -r '."compartment-id"' <<<"${BUCKET}")
          PUBLIC_ACCESS=$(jq -r '."public-access-type"' <<<"${BUCKET}")
          VERSIONING=$(jq -r '.versioning' <<<"${BUCKET}")
          if [[ "${BUCKET_COMPARTMENT}" != "${OCI_CLI_COMPARTMENT}" ||
            "${PUBLIC_ACCESS}" != "NoPublicAccess" ||
            "${VERSIONING}" != "Enabled" ]]; then
            echo "ERRO: Backend existente não atende compartment, privacidade e versionamento esperados." >&2
            exit 1
          fi

          {
            echo "namespace=${NAMESPACE}"
            echo "bucket=${TF_STATE_BUCKET}"
            echo "region=${OCI_CLI_REGION}"
          } >>"${GITHUB_OUTPUT}"

      - name: Validar secret PostgreSQL existente sem alterações (PR)
        id: secrets_preflight_pr
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          VAULTS=$(oci --auth api_key --region "${OCI_CLI_REGION}" kms management vault list \
            --compartment-id "${OCI_CLI_COMPARTMENT}" \
            --all \
            --query 'data')
          MATCHING_VAULTS=$(jq -c \
            '[.[] | select(."display-name" == "solidarytech-vault-prod")]' <<<"${VAULTS}")
          VAULT_COUNT=$(jq 'length' <<<"${MATCHING_VAULTS}")
          if [[ "${VAULT_COUNT}" -ne 1 ]]; then
            echo "ERRO: Vault solidarytech-vault-prod ausente ou ambíguo; execute o preflight manual antes do PR." >&2
            exit 1
          fi

          VAULT_ID=$(jq -r '.[0].id' <<<"${MATCHING_VAULTS}")
          VAULT=$(oci --auth api_key --region "${OCI_CLI_REGION}" kms management vault get \
            --vault-id "${VAULT_ID}" \
            --query 'data')
          if [[ "$(jq -r '."lifecycle-state"' <<<"${VAULT}")" != "ACTIVE" ]]; then
            echo "ERRO: Vault solidarytech-vault-prod não está ACTIVE." >&2
            exit 1
          fi

          SECRETS=$(oci --auth api_key --region "${OCI_CLI_REGION}" vault secret list \
            --compartment-id "${OCI_CLI_COMPARTMENT}" \
            --vault-id "${VAULT_ID}" \
            --name solidarytech-postgres-password \
            --all \
            --query 'data')
          MATCHING_SECRETS=$(jq -c \
            '[.[] | select(."secret-name" == "solidarytech-postgres-password" and ."lifecycle-state" == "ACTIVE")]' \
            <<<"${SECRETS}")
          SECRET_COUNT=$(jq 'length' <<<"${MATCHING_SECRETS}")
          if [[ "${SECRET_COUNT}" -ne 1 ]]; then
            echo "ERRO: Secret PostgreSQL ACTIVE ausente ou ambíguo; execute o preflight manual antes do PR." >&2
            exit 1
          fi

          echo "secret_id=$(jq -r '.[0].id' <<<"${MATCHING_SECRETS}")" >>"${GITHUB_OUTPUT}"

      - name: Setup Terraform (1.12.0+ para backend nativo OCI)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: Preparar credencial e inicializar Terraform
        id: init
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p ~/.oci
          printf "%s\n" "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          export TF_VAR_private_key_path="$HOME/.oci/oci_api_key.pem"
          export OCI_PRIVATE_KEY_PATH="$HOME/.oci/oci_api_key.pem"
          export OCI_TENANCY_OCID="$OCI_CLI_TENANCY"
          export OCI_USER_OCID="$OCI_CLI_USER"
          export OCI_FINGERPRINT="$OCI_CLI_FINGERPRINT"
          export OCI_REGION="$OCI_CLI_REGION"

          terraform init -input=false \
            -backend-config="namespace=${{ steps.preflight.outputs.namespace || steps.preflight_pr.outputs.namespace }}" \
            -backend-config="bucket=${{ steps.preflight.outputs.bucket || steps.preflight_pr.outputs.bucket }}" \
            -backend-config="key=${{ inputs.state_key }}" \
            -backend-config="region=${{ steps.preflight.outputs.region || steps.preflight_pr.outputs.region }}"

      - name: Terraform Validate & Plan
        id: plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: ${{ inputs.working_directory }}
        run: |
          export TF_VAR_private_key_path="$HOME/.oci/oci_api_key.pem"
          export OCI_PRIVATE_KEY_PATH="$HOME/.oci/oci_api_key.pem"
          export OCI_TENANCY_OCID="$OCI_CLI_TENANCY"
          export OCI_USER_OCID="$OCI_CLI_USER"
          export OCI_FINGERPRINT="$OCI_CLI_FINGERPRINT"
          export OCI_REGION="$OCI_CLI_REGION"
          export TF_VAR_db_secret_id="${{ steps.secrets_preflight.outputs.secret_id || steps.secrets_preflight_pr.outputs.secret_id }}"

          terraform validate
          terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        id: apply
        if: inputs.action == 'apply' && github.event_name != 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: |
          export TF_VAR_private_key_path="$HOME/.oci/oci_api_key.pem"
          export OCI_PRIVATE_KEY_PATH="$HOME/.oci/oci_api_key.pem"
          export OCI_TENANCY_OCID="$OCI_CLI_TENANCY"
          export OCI_USER_OCID="$OCI_CLI_USER"
          export OCI_FINGERPRINT="$OCI_CLI_FINGERPRINT"
          export OCI_REGION="$OCI_CLI_REGION"
          export TF_VAR_db_secret_id="${{ steps.secrets_preflight.outputs.secret_id }}"

          terraform apply -input=false -auto-approve tfplan
          echo "### Outputs Provisionados" >> /tmp/tf_outputs.md
          echo '```json' >> /tmp/tf_outputs.md
          terraform output -json >> /tmp/tf_outputs.md
          echo '```' >> /tmp/tf_outputs.md

      - name: Setup Helm para remoção do Ingress
        if: inputs.action == 'destroy' && github.event_name != 'pull_request'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Remover Load Balancer do Ingress antes do destroy
        if: inputs.action == 'destroy' && github.event_name != 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          export TF_VAR_private_key_path="$HOME/.oci/oci_api_key.pem"
          export OCI_PRIVATE_KEY_PATH="$HOME/.oci/oci_api_key.pem"
          export OCI_TENANCY_OCID="$OCI_CLI_TENANCY"
          export OCI_USER_OCID="$OCI_CLI_USER"
          export OCI_FINGERPRINT="$OCI_CLI_FINGERPRINT"
          export OCI_REGION="$OCI_CLI_REGION"

          TERRAFORM_OUTPUTS=$(terraform output -json)
          OKE_CLUSTER_ID=$(jq -r '.oke_cluster_id.value // empty' <<<"${TERRAFORM_OUTPUTS}")
          if [[ -z "${OKE_CLUSTER_ID}" ]]; then
            echo "Output oke_cluster_id ausente; nenhum cluster identificado para a limpeza preventiva."
            exit 0
          fi

          CLUSTER=$(oci --auth api_key --region "${OCI_CLI_REGION}" ce cluster get \
            --cluster-id "${OKE_CLUSTER_ID}" \
            --query 'data')
          CLUSTER_STATE=$(jq -r '."lifecycle-state"' <<<"${CLUSTER}")
          if [[ "${CLUSTER_STATE}" != "ACTIVE" ]]; then
            echo "Cluster OKE não está ACTIVE (${CLUSTER_STATE}); nenhum Ingress a remover."
            exit 0
          fi

          is_ipv4() {
            python3 -c 'import ipaddress, sys; ipaddress.IPv4Address(sys.argv[1])' \
              "$1" >/dev/null 2>&1
          }

          RUNNER_IP=$(curl -fsSL --max-time 10 https://checkip.amazonaws.com \
            | tr -d '[:space:]') || RUNNER_IP=""
          if ! is_ipv4 "${RUNNER_IP}"; then
            RUNNER_IP=$(curl -fsSL --max-time 10 https://ifconfig.me/ip \
              | tr -d '[:space:]') || RUNNER_IP=""
          fi
          if ! is_ipv4 "${RUNNER_IP}"; then
            echo "ERRO: Não foi possível obter um IPv4 público válido para o runner." >&2
            exit 1
          fi
          RUNNER_CIDR="${RUNNER_IP}/32"

          SECURITY_LISTS=$(oci network security-list list \
            --compartment-id "${OCI_CLI_COMPARTMENT}" \
            --display-name "solidarytech-sl-public-lb" \
            --lifecycle-state AVAILABLE \
            --all \
            --query 'data')
          MATCHING_SECURITY_LISTS=$(jq -c \
            '[.[] | select(."display-name" == "solidarytech-sl-public-lb" and ."lifecycle-state" == "AVAILABLE")]' \
            <<<"${SECURITY_LISTS}")
          SECURITY_LIST_COUNT=$(jq 'length' <<<"${MATCHING_SECURITY_LISTS}")
          if [[ "${SECURITY_LIST_COUNT}" -ne 1 ]]; then
            echo "ERRO: Esperada exatamente uma Security List AVAILABLE 'solidarytech-sl-public-lb'; encontradas: ${SECURITY_LIST_COUNT}." >&2
            exit 1
          fi
          SECURITY_LIST_ID=$(jq -r '.[0].id' <<<"${MATCHING_SECURITY_LISTS}")
          RUNNER_RULE_DESCRIPTION="temp-gh-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RULES_HELPER="${RUNNER_TEMP}/solidarytech-security-list-rules.py"
          RULES_SOURCE_FILE="${RUNNER_TEMP}/solidarytech-ingress-rules-source.json"
          RULES_CURRENT_FILE="${RUNNER_TEMP}/solidarytech-ingress-rules-current.json"
          RULES_UPDATE_FILE="${RUNNER_TEMP}/solidarytech-ingress-rules-update.json"

          cat > "${RULES_HELPER}" <<'PY'
          import json
          import sys
          from pathlib import Path

          def is_runner_rule(rule, runner_cidr):
              tcp_options = rule.get("tcp-options") or {}
              destination = tcp_options.get("destination-port-range") or {}
              return (
                  rule.get("source") == runner_cidr
                  and str(rule.get("protocol")) == "6"
                  and rule.get("source-type", "CIDR_BLOCK") == "CIDR_BLOCK"
                  and not rule.get("is-stateless", False)
                  and destination.get("min") == 6443
                  and destination.get("max") == 6443
              )

          def is_temporary_rule(rule):
              tcp_options = rule.get("tcp-options") or {}
              destination = tcp_options.get("destination-port-range") or {}
              description = rule.get("description") or ""
              return (
                  description.startswith("temp-gh-runner-")
                  and str(rule.get("protocol")) == "6"
                  and destination.get("min") == 6443
                  and destination.get("max") == 6443
              )

          def convert_port_options(options):
              if not isinstance(options, dict):
                  return None
              converted = {}
              for old_name, new_name in (
                  ("destination-port-range", "destinationPortRange"),
                  ("source-port-range", "sourcePortRange"),
              ):
                  port_range = options.get(old_name)
                  if isinstance(port_range, dict):
                      converted[new_name] = {
                          key: port_range[key]
                          for key in ("min", "max")
                          if port_range.get(key) is not None
                      }
              return converted or None

          def convert_rule(rule):
              converted = {
                  "isStateless": rule.get("is-stateless", False),
                  "protocol": rule["protocol"],
              }
              for old_name, new_name in (
                  ("description", "description"),
                  ("source", "source"),
                  ("source-type", "sourceType"),
              ):
                  if rule.get(old_name) is not None:
                      converted[new_name] = rule[old_name]
              icmp_options = rule.get("icmp-options")
              if isinstance(icmp_options, dict):
                  converted["icmpOptions"] = {
                      key: icmp_options[key]
                      for key in ("type", "code")
                      if icmp_options.get(key) is not None
                  }
              for old_name, new_name in (
                  ("tcp-options", "tcpOptions"),
                  ("udp-options", "udpOptions"),
              ):
                  options = convert_port_options(rule.get(old_name))
                  if options:
                      converted[new_name] = options
              return converted

          mode, source_file, update_file, runner_cidr, runner_description, *extra = sys.argv[1:]
          rules = json.loads(Path(source_file).read_text())
          if rules is None:
              rules = []
          if not isinstance(rules, list):
              raise SystemExit("Ingress rules OCI CLI não retornou uma lista.")

          if mode == "add":
              orphan_rules = [rule for rule in rules if is_temporary_rule(rule)]
              rules = [rule for rule in rules if not is_temporary_rule(rule)]
              rule_exists = any(is_runner_rule(rule, runner_cidr) for rule in rules)
              update_rules = [convert_rule(rule) for rule in rules]
              if not rule_exists:
                  update_rules.append({
                      "description": runner_description,
                      "isStateless": False,
                      "protocol": "6",
                      "source": runner_cidr,
                      "sourceType": "CIDR_BLOCK",
                      "tcpOptions": {
                          "destinationPortRange": {"min": 6443, "max": 6443}
                      },
                  })
              Path(update_file).write_text(json.dumps(update_rules))
              print(json.dumps({
                  "rule_added": not rule_exists,
                  "orphan_rules_removed": len(orphan_rules),
              }))
          elif mode == "remove":
              rule_added = extra[0] == "true"
              def should_remove(rule):
                  description = rule.get("description") or ""
                  return is_temporary_rule(rule) or (
                      rule_added
                      and is_runner_rule(rule, runner_cidr)
                      and (
                          description == runner_description
                          or description.startswith("temp-gh-runner-")
                      )
                  )

              matching_rules = [rule for rule in rules if should_remove(rule)]
              rules = [rule for rule in rules if not should_remove(rule)]
              Path(update_file).write_text(
                  json.dumps([convert_rule(rule) for rule in rules])
              )
              print(len(matching_rules))
          else:
              raise SystemExit(f"Modo de operação inválido: {mode}")
          PY
          chmod 600 "${RULES_HELPER}"

          cleanup_security_list() {
            local exit_status=$?
            trap - EXIT
            set +e

            if [[ -n "${SECURITY_LIST_ID:-}" && -f "${RULES_HELPER:-}" ]]; then
              local revoked=0
              for attempt in 1 2 3; do
                if ! CURRENT_RULES=$(oci network security-list get \
                  --security-list-id "${SECURITY_LIST_ID}" \
                  --query 'data."ingress-security-rules"'); then
                  echo "Falha ao ler regras para revogação (tentativa ${attempt}/3)." >&2
                  sleep $((attempt * 5))
                  continue
                fi
                printf '%s\n' "${CURRENT_RULES}" > "${RULES_CURRENT_FILE}"

                if ! REMOVED_COUNT=$(python3 "${RULES_HELPER}" remove \
                  "${RULES_CURRENT_FILE}" \
                  "${RULES_UPDATE_FILE}" \
                  "${RUNNER_CIDR}" \
                  "${RUNNER_RULE_DESCRIPTION}" \
                  "${RUNNER_RULE_ADDED:-false}"); then
                  echo "Falha ao processar regras para revogação (tentativa ${attempt}/3)." >&2
                  sleep $((attempt * 5))
                  continue
                fi
                if [[ "${REMOVED_COUNT}" -eq 0 ]]; then
                  echo "A regra temporária do runner já está ausente; estado preservado."
                  revoked=1
                  break
                fi

                if oci network security-list update \
                  --security-list-id "${SECURITY_LIST_ID}" \
                  --ingress-security-rules "file://${RULES_UPDATE_FILE}" \
                  --force \
                  --wait-for-state AVAILABLE \
                  --max-wait-seconds 180 \
                  >/dev/null; then
                  echo "A regra temporária do runner foi revogada."
                  revoked=1
                  break
                fi
                echo "Falha ao atualizar a Security List para revogar o acesso (tentativa ${attempt}/3)." >&2
                sleep $((attempt * 5))
              done

              if [[ "${revoked}" -ne 1 ]]; then
                echo "ERRO: Não foi possível confirmar a revogação do acesso temporário após três tentativas." >&2
                if [[ "${exit_status}" -eq 0 ]]; then
                  exit_status=1
                fi
              fi
            fi

            rm -f \
              "${RULES_HELPER:-}" \
              "${RULES_SOURCE_FILE:-}" \
              "${RULES_CURRENT_FILE:-}" \
              "${RULES_UPDATE_FILE:-}"
            exit "${exit_status}"
          }
          trap cleanup_security_list EXIT

          CURRENT_RULES=$(oci network security-list get \
            --security-list-id "${SECURITY_LIST_ID}" \
            --query 'data."ingress-security-rules"')
          printf '%s\n' "${CURRENT_RULES}" > "${RULES_SOURCE_FILE}"
          RUNNER_RULE_RESULT=$(python3 "${RULES_HELPER}" add \
            "${RULES_SOURCE_FILE}" \
            "${RULES_UPDATE_FILE}" \
            "${RUNNER_CIDR}" \
            "${RUNNER_RULE_DESCRIPTION}")
          RUNNER_RULE_ADDED=$(jq -r '.rule_added' <<<"${RUNNER_RULE_RESULT}")
          ORPHAN_RULES_REMOVED=$(jq -r '.orphan_rules_removed' <<<"${RUNNER_RULE_RESULT}")

          if [[ "${RUNNER_RULE_ADDED}" == "true" || "${ORPHAN_RULES_REMOVED}" -gt 0 ]]; then
            oci network security-list update \
              --security-list-id "${SECURITY_LIST_ID}" \
              --ingress-security-rules "file://${RULES_UPDATE_FILE}" \
              --force \
              --wait-for-state AVAILABLE \
              --max-wait-seconds 180 \
              >/dev/null
            echo "Regras temporárias anteriores removidas; acesso desta execução configurado."
          else
            echo "A regra equivalente já existia; nenhuma alteração foi necessária."
          fi

          mkdir -p "${HOME}/.kube"
          chmod 700 "${HOME}/.kube"
          oci --auth api_key --region "${OCI_CLI_REGION}" ce cluster create-kubeconfig \
            --cluster-id "${OKE_CLUSTER_ID}" \
            --file "${HOME}/.kube/config" \
            --overwrite \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          chmod 600 "${HOME}/.kube/config"
          helm uninstall traefik \
            -n traefik \
            --ignore-not-found \
            --wait \
            --timeout 10m
          helm uninstall ingress-nginx \
            -n ingress-nginx \
            --ignore-not-found \
            --wait \
            --timeout 10m

      - name: Terraform Destroy
        id: destroy
        if: inputs.action == 'destroy' && github.event_name != 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: |
          export TF_VAR_private_key_path="$HOME/.oci/oci_api_key.pem"
          export OCI_PRIVATE_KEY_PATH="$HOME/.oci/oci_api_key.pem"
          export OCI_TENANCY_OCID="$OCI_CLI_TENANCY"
          export OCI_USER_OCID="$OCI_CLI_USER"
          export OCI_FINGERPRINT="$OCI_CLI_FINGERPRINT"
          export OCI_REGION="$OCI_CLI_REGION"
          export TF_VAR_db_secret_id="${{ steps.secrets_preflight.outputs.secret_id }}"

          terraform destroy -input=false -auto-approve

      - name: Gerar Sumário de Execução
        if: always()
        run: |
          {
            echo "## Resumo de Infraestrutura — OCI (${{ inputs.action }})"
            echo ""
            echo "| Etapa | Status |"
            echo "|---|---|"
            echo "| Preflight & State Bucket | \`${{ steps.preflight.outcome == 'success' && steps.preflight.outcome || steps.preflight_pr.outcome }}\` |"
            echo "| Preflight & OCI Vault Secrets | \`${{ steps.secrets_preflight.outcome == 'success' && steps.secrets_preflight.outcome || steps.secrets_preflight_pr.outcome }}\` |"
            echo "| Terraform Init | \`${{ steps.init.outcome }}\` |"
            echo "| Terraform Validate & Plan | \`${{ steps.plan.outcome }}\` |"
            echo "| Terraform Apply | \`${{ steps.apply.outcome }}\` |"
            echo "| Terraform Destroy | \`${{ steps.destroy.outcome }}\` |"
            echo ""
            echo "- **Diretório:** \`${{ inputs.working_directory }}\`"
            echo "- **Bucket State:** \`${{ steps.preflight.outputs.bucket || steps.preflight_pr.outputs.bucket }}\` (Namespace: \`${{ steps.preflight.outputs.namespace || steps.preflight_pr.outputs.namespace }}\`)"
            echo "- **Vault Secret ID:** \`${{ steps.secrets_preflight.outputs.secret_id || steps.secrets_preflight_pr.outputs.secret_id }}\`"
            echo "- **Arquivo State:** \`${{ inputs.state_key }}\`"
            echo ""
            if [[ -f /tmp/tf_outputs.md ]]; then
              cat /tmp/tf_outputs.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar chave privada temporária do runner
        if: always()
        run: rm -f ~/.oci/oci_api_key.pem ~/.kube/config /tmp/tf_outputs.md