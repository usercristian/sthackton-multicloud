name: Pipeline CI/CD

on:
  push:
    branches: ["master"]
    paths:
      - "services/donation-service/**"
      - "services/ngo-service/**"
      - "services/volunteer-service/**"
      - ".github/workflows/ci-apps.yml"
      - ".github/workflows/_reusable-ci-devsecops.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "services/donation-service/**"
      - "services/ngo-service/**"
      - "services/volunteer-service/**"
      - ".github/workflows/ci-apps.yml"
      - ".github/workflows/_reusable-ci-devsecops.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  ensure-oci-vault:
    name: Ensure OCI Vault & OCIR token
    runs-on: ubuntu-latest
    concurrency:
      group: oci-vault-secrets-preflight
      cancel-in-progress: false
    steps:
      - name: Checkout do código
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Setup Python para OCI CLI
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar OCI CLI
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install --disable-pip-version-check oci-cli

      - name: Preflight automático de OCI Vault e Auth Token OCIR
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_CLI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_CLI_REGION: sa-saopaulo-1
        run: |
          chmod +x infra/scripts/oci-secrets-preflight.sh
          ./infra/scripts/oci-secrets-preflight.sh

  detect-changes:
    name: Scope Discovery
    runs-on: ubuntu-latest
    outputs:
      donation: ${{ steps.eval.outputs.donation }}
      ngo: ${{ steps.eval.outputs.ngo }}
      volunteer: ${{ steps.eval.outputs.volunteer }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Filtrar caminhos modificados
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            donation:
              - 'services/donation-service/**'
            ngo:
              - 'services/ngo-service/**'
            volunteer:
              - 'services/volunteer-service/**'
            workflows:
              - '.github/workflows/**'

      - name: Avaliar flags de execução por serviço
        id: eval
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.filter.outputs.workflows }}" == "true" ]]; then
            echo "donation=true" >> "$GITHUB_OUTPUT"
            echo "ngo=true" >> "$GITHUB_OUTPUT"
            echo "volunteer=true" >> "$GITHUB_OUTPUT"
          else
            echo "donation=${{ steps.filter.outputs.donation || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "ngo=${{ steps.filter.outputs.ngo || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "volunteer=${{ steps.filter.outputs.volunteer || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

  donation-service:
    name: donation-service
    needs: [detect-changes, ensure-oci-vault]
    if: needs.detect-changes.outputs.donation == 'true'
    uses: ./.github/workflows/_reusable-ci-devsecops.yml
    with:
      service_name: donation-service
      service_path: services/donation-service
      language: go
      push_image: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    secrets:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}

  ngo-service:
    name: ngo-service
    needs: [detect-changes, ensure-oci-vault]
    if: needs.detect-changes.outputs.ngo == 'true'
    uses: ./.github/workflows/_reusable-ci-devsecops.yml
    with:
      service_name: ngo-service
      service_path: services/ngo-service
      language: python
      push_image: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    secrets:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}

  volunteer-service:
    name: volunteer-service
    needs: [detect-changes, ensure-oci-vault]
    if: needs.detect-changes.outputs.volunteer == 'true'
    uses: ./.github/workflows/_reusable-ci-devsecops.yml
    with:
      service_name: volunteer-service
      service_path: services/volunteer-service
      language: python
      push_image: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    secrets:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}

  deploy-oke-gitops:
    name: Deploy OKE through ArgoCD
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: solidarytech-oke-gitops-deploy
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    needs:
      - detect-changes
      - ensure-oci-vault
      - donation-service
      - ngo-service
      - volunteer-service
    if: >-
      ${{
        always() &&
        ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') &&
        needs.detect-changes.result == 'success' &&
        needs.ensure-oci-vault.result == 'success' &&
        (needs['donation-service'].result == 'success' || needs['donation-service'].result == 'skipped') &&
        (needs['ngo-service'].result == 'success' || needs['ngo-service'].result == 'skipped') &&
        (needs['volunteer-service'].result == 'success' || needs['volunteer-service'].result == 'skipped')
      }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4

      - name: Setup Python para OCI CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar OCI CLI
        run: |
          python -m pip install --disable-pip-version-check oci-cli

      - name: Configurar OCI CLI
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_CLI_REGION: sa-saopaulo-1
        run: |
          set -euo pipefail
          set +x
          : "${OCI_CLI_TENANCY:?Secret OCI_TENANCY_OCID não configurado}"
          : "${OCI_CLI_USER:?Secret OCI_USER_OCID não configurado}"
          : "${OCI_CLI_FINGERPRINT:?Secret OCI_FINGERPRINT não configurado}"
          : "${OCI_CLI_KEY_CONTENT:?Secret OCI_PRIVATE_KEY não configurado}"

          mkdir -m 700 -p "${HOME}/.oci"
          umask 077
          OCI_KEY_FILE="${HOME}/.oci/oci_api_key.pem"
          printf '%s\n' "${OCI_CLI_KEY_CONTENT}" > "${OCI_KEY_FILE}"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "${OCI_CLI_USER}" \
            "${OCI_CLI_FINGERPRINT}" \
            "${OCI_CLI_TENANCY}" \
            "${OCI_CLI_REGION}" \
            "${OCI_KEY_FILE}" > "${HOME}/.oci/config"

      - name: Aguardar lifecycle OCI e provisionar cluster sob demanda
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_CLI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_CLI_REGION: sa-saopaulo-1
        run: |
          set -euo pipefail

          wait_for_active_infra_runs() {
            while true; do
              ACTIVE_RUNS=$(gh run list \
                --workflow infra-oci-lifecycle.yml \
                --status in_progress \
                --limit 100 \
                --json databaseId \
                --jq '.[].databaseId')
              QUEUED_RUNS=$(gh run list \
                --workflow infra-oci-lifecycle.yml \
                --status queued \
                --limit 100 \
                --json databaseId \
                --jq '.[].databaseId')
              RUN_IDS=$(printf '%s\n%s\n' "${ACTIVE_RUNS}" "${QUEUED_RUNS}" | sed '/^$/d' | sort -u)
              if [[ -z "${RUN_IDS}" ]]; then
                break
              fi
              while IFS= read -r run_id; do
                if [[ -n "${run_id}" ]]; then
                  gh run watch "${run_id}"
                fi
              done <<<"${RUN_IDS}"
            done
          }

          wait_for_active_infra_runs

          CLUSTERS=$(oci --auth api_key --region "${OCI_CLI_REGION}" ce cluster list \
            --compartment-id "${OCI_CLI_COMPARTMENT}" \
            --all \
            --query 'data')
          ACTIVE_CLUSTER_ID=$(jq -r \
            '[.[] | select(.name == "solidarytech-oke-prod" and ."lifecycle-state" == "ACTIVE")][0].id // empty' \
            <<<"${CLUSTERS}")

          if [[ -n "${ACTIVE_CLUSTER_ID}" ]]; then
            echo "Cluster solidarytech-oke-prod já está ACTIVE; pulando Terraform apply."
          else
            LATEST_INFRA_RUN_ID=$(gh run list \
              --workflow infra-oci-lifecycle.yml \
              --limit 100 \
              --json databaseId \
              --jq 'map(.databaseId) | max // 0')
            gh workflow run infra-oci-lifecycle.yml --ref master -f action=apply

            APPLY_RUN_ID=""
            for attempt in {1..30}; do
              APPLY_RUN_ID=$(gh run list \
                --workflow infra-oci-lifecycle.yml \
                --limit 100 \
                --json databaseId,event,headBranch \
                --jq "[.[] | select(.event == \"workflow_dispatch\" and .headBranch == \"master\" and .databaseId > ${LATEST_INFRA_RUN_ID})] | max_by(.databaseId).databaseId // empty")
              if [[ -n "${APPLY_RUN_ID}" ]]; then
                break
              fi
              sleep 2
            done
            if [[ -z "${APPLY_RUN_ID}" ]]; then
              echo "ERRO: Não foi possível localizar a execução Terraform disparada." >&2
              exit 1
            fi
            gh run watch "${APPLY_RUN_ID}" --exit-status
          fi

      - name: Bootstrap GitOps, Secrets e ArgoCD
        env:
          OCI_CLI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_REGION: sa-saopaulo-1
        run: |
          chmod +x infra/scripts/oci-oke-gitops-bootstrap.sh
          ./infra/scripts/oci-oke-gitops-bootstrap.sh

      - name: Limpar credenciais temporárias OCI e kubeconfig
        if: always()
        run: rm -f "${HOME}/.oci/config" "${HOME}/.oci/oci_api_key.pem" "${HOME}/.kube/config"