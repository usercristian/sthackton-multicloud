name: Pipeline CI & DevSecOps

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "donation-service/**"
      - "ngo-service/**"
      - "volunteer-service/**"
      - ".github/workflows/ci-apps.yml"
      - ".github/workflows/_reusable-ci-devsecops.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "donation-service/**"
      - "ngo-service/**"
      - "volunteer-service/**"
      - ".github/workflows/ci-apps.yml"
      - ".github/workflows/_reusable-ci-devsecops.yml"
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detectar Serviços Alterados
    runs-on: ubuntu-latest
    outputs:
      donation: ${{ steps.eval.outputs.donation }}
      ngo: ${{ steps.eval.outputs.ngo }}
      volunteer: ${{ steps.eval.outputs.volunteer }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Filtrar caminhos modificados
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            donation:
              - 'donation-service/**'
            ngo:
              - 'ngo-service/**'
            volunteer:
              - 'volunteer-service/**'
            workflows:
              - '.github/workflows/**'

      - name: Avaliar flags de execução por serviço
        id: eval
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.filter.outputs.workflows }}" == "true" ]]; then
            echo "donation=true" >> "$GITHUB_OUTPUT"
            echo "ngo=true" >> "$GITHUB_OUTPUT"
            echo "volunteer=true" >> "$GITHUB_OUTPUT"
          else
            echo "donation=${{ steps.filter.outputs.donation || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "ngo=${{ steps.filter.outputs.ngo || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "volunteer=${{ steps.filter.outputs.volunteer || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

  donation-service:
    name: donation-service
    needs: detect-changes
    if: needs.detect-changes.outputs.donation == 'true'
    uses: ./.github/workflows/_reusable-ci-devsecops.yml
    with:
      service_name: donation-service
      service_path: donation-service
      language: go

  ngo-service:
    name: ngo-service
    needs: detect-changes
    if: needs.detect-changes.outputs.ngo == 'true'
    uses: ./.github/workflows/_reusable-ci-devsecops.yml
    with:
      service_name: ngo-service
      service_path: ngo-service
      language: python

  volunteer-service:
    name: volunteer-service
    needs: detect-changes
    if: needs.detect-changes.outputs.volunteer == 'true'
    uses: ./.github/workflows/_reusable-ci-devsecops.yml
    with:
      service_name: volunteer-service
      service_path: volunteer-service
      language: python