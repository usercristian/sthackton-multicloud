name: Pipeline CI/CD

on:
  push:
    branches: ["master"]
    paths:
      - "services/donation-service/**"
      - "services/ngo-service/**"
      - "services/volunteer-service/**"
      - ".github/workflows/ci-apps.yml"
      - ".github/workflows/_reusable-ci-devsecops.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "services/donation-service/**"
      - "services/ngo-service/**"
      - "services/volunteer-service/**"
      - ".github/workflows/ci-apps.yml"
      - ".github/workflows/_reusable-ci-devsecops.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Scope Discovery
    runs-on: ubuntu-latest
    outputs:
      donation: ${{ steps.eval.outputs.donation }}
      ngo: ${{ steps.eval.outputs.ngo }}
      volunteer: ${{ steps.eval.outputs.volunteer }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Filtrar caminhos modificados
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            donation:
              - 'services/donation-service/**'
            ngo:
              - 'services/ngo-service/**'
            volunteer:
              - 'services/volunteer-service/**'
            workflows:
              - '.github/workflows/**'

      - name: Avaliar flags de execução por serviço
        id: eval
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.filter.outputs.workflows }}" == "true" ]]; then
            echo "donation=true" >> "$GITHUB_OUTPUT"
            echo "ngo=true" >> "$GITHUB_OUTPUT"
            echo "volunteer=true" >> "$GITHUB_OUTPUT"
          else
            echo "donation=${{ steps.filter.outputs.donation || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "ngo=${{ steps.filter.outputs.ngo || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "volunteer=${{ steps.filter.outputs.volunteer || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

  donation-service:
    name: donation-service
    needs: [detect-changes]
    if: needs.detect-changes.outputs.donation == 'true'
    uses: ./.github/workflows/_reusable-ci-devsecops.yml
    with:
      service_name: donation-service
      service_path: services/donation-service
      language: go
      push_image: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    secrets:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}

  ngo-service:
    name: ngo-service
    needs: [detect-changes]
    if: needs.detect-changes.outputs.ngo == 'true'
    uses: ./.github/workflows/_reusable-ci-devsecops.yml
    with:
      service_name: ngo-service
      service_path: services/ngo-service
      language: python
      push_image: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    secrets:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}

  volunteer-service:
    name: volunteer-service
    needs: [detect-changes]
    if: needs.detect-changes.outputs.volunteer == 'true'
    uses: ./.github/workflows/_reusable-ci-devsecops.yml
    with:
      service_name: volunteer-service
      service_path: services/volunteer-service
      language: python
      push_image: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    secrets:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}

  update-gitops-manifests:
    name: Update GitOps image tags
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-manifest-update
      cancel-in-progress: false
    permissions:
      contents: write
    needs:
      - detect-changes
      - donation-service
      - ngo-service
      - volunteer-service
    if: >-
      ${{
        always() &&
        ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') &&
        needs.detect-changes.result == 'success' &&
        (needs['donation-service'].result == 'success' || needs['donation-service'].result == 'skipped') &&
        (needs['ngo-service'].result == 'success' || needs['ngo-service'].result == 'skipped') &&
        (needs['volunteer-service'].result == 'success' || needs['volunteer-service'].result == 'skipped')
      }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Atualizar tags SHA dos serviços publicados
        env:
          UPDATE_DONATION: ${{ needs['donation-service'].result == 'success' }}
          UPDATE_NGO: ${{ needs['ngo-service'].result == 'success' }}
          UPDATE_VOLUNTEER: ${{ needs['volunteer-service'].result == 'success' }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          KUSTOMIZATION="k8s/overlays/oci-prod/kustomization.yaml"

          git checkout -B master
          git pull --rebase origin master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - "${KUSTOMIZATION}" "${IMAGE_TAG}" \
            "${UPDATE_DONATION}" "${UPDATE_NGO}" "${UPDATE_VOLUNTEER}" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          image_tag = sys.argv[2]
          selected = {
              name
              for name, should_update in zip(
                  ("donation-service", "ngo-service", "volunteer-service"),
                  sys.argv[3:],
              )
              if should_update == "true"
          }
          lines = manifest.read_text().splitlines(keepends=True)
          current_image = None
          updates = {name: 0 for name in selected}

          for index, line in enumerate(lines):
              if line.startswith("  - name: "):
                  current_image = line.removeprefix("  - name: ").strip().rsplit("/", 1)[-1]
              elif current_image in selected and line.startswith("    newTag: "):
                  lines[index] = f"    newTag: {image_tag}\n"
                  updates[current_image] += 1
                  current_image = None

          invalid = [name for name, count in updates.items() if count != 1]
          if invalid:
              raise SystemExit(f"Esperada uma única tag por serviço: {', '.join(invalid)}")

          manifest.write_text("".join(lines))
          print(f"Serviços com tag atualizada: {', '.join(sorted(selected)) or 'nenhum'}")
          PY

          if git diff --quiet -- "${KUSTOMIZATION}"; then
            echo "As tags GitOps já correspondem ao SHA ${SHORT_SHA}; nenhum commit necessário."
            exit 0
          fi

          git add -- "${KUSTOMIZATION}"
          git commit -m "chore(gitops): update image tags to ${SHORT_SHA} [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master